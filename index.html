<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F5F6FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="계산 노트">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>My Calculator</title>
<style>
:root{
  --bg:#F5F6FB; --card:#FFFFFF; --ink:#1F2437; --sub:#7A809A;
  --line:#EBEDF4; --line-strong:#D3D8E6; --accent:#5B54E8; --accent-dark:#4C46D6; --accent-soft:#EEEDFD;
  --danger:#EF6C6C; --danger-soft:#FDECEC;
  --shadow:0 1px 2px rgba(31,36,55,.04),0 8px 24px rgba(31,36,55,.06);
  --radius:18px;
}
.divider{border:none;border-top:2px solid var(--line-strong);margin:16px 0;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start;background:var(--bg);color:var(--ink);}

#app{
  width:100%;
  max-width:430px;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ── 헤더 ── */
.app-header{
  background:transparent;
  padding:env(safe-area-inset-top,14px) 16px 10px;
  padding-top:max(env(safe-area-inset-top),14px);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.header-icon{width:42px;height:42px;border-radius:13px;overflow:hidden;flex-shrink:0;}
.header-icon img{width:100%;height:100%;object-fit:cover;}
.header-title{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.3px;}

/* ── 탭바 (견출지 스타일: 활성 탭이 카드와 이어짐) ── */
.tab-bar{
  display:flex;
  gap:0;
  background:transparent;
  padding:0 10px;
  overflow-x:auto;
  flex-shrink:0;
}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-item{
  position:relative;
  flex:1;min-width:54px;
  padding:10px 2px 9px;
  text-align:center;
  font-size:13px;
  font-weight:700;
  color:var(--sub);
  background:transparent;
  cursor:pointer;
  border-radius:8px 8px 0 0;
  white-space:nowrap;
  user-select:none;
}
.tab-item.active{background:var(--card);color:var(--accent);font-weight:800;border-bottom:1px solid var(--card);margin-bottom:-1px;}
.tab-item.active::before,
.tab-item.active::after{
  content:"";
  position:absolute;
  bottom:0;
  width:8px;height:8px;
  pointer-events:none;
}
.tab-item.active::before{left:-8px;background:radial-gradient(circle at top left, transparent 8px, var(--card) 8px);}
.tab-item.active::after{right:-8px;background:radial-gradient(circle at top right, transparent 8px, var(--card) 8px);}
.tab-item:first-child.active::before{content:none;}
.tab-item:last-child.active::after{content:none;}
.tab-item:first-child.active{border-top-left-radius:var(--radius);}
.tab-item:last-child.active{border-top-right-radius:var(--radius);}
.tab-item .ti{display:block;font-size:19px;margin-bottom:3px;}

/* ── 스크린 / 탭 카드 ── */
.screens{position:relative;flex:1;overflow:hidden;}
.screen{display:none;padding:0 10px 10px;overflow-y:auto;position:absolute;top:0;left:0;width:100%;height:100%;}
.screen.active{display:block;}
#app{overflow-x:hidden;}
.tab-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.tab-card + .tab-card{margin-top:12px;}
.tab-card.corner-first{border-radius:0 var(--radius) var(--radius) var(--radius);}
.tab-card.corner-last{border-radius:var(--radius) 0 var(--radius) var(--radius);}

/* ══════════════════════════════
   계산기
══════════════════════════════ */
.calc-display{
  background:transparent;
  height:140px;
  overflow:hidden;
  display:flex;flex-direction:column;
}
.calc-history{overflow-y:auto;max-height:64px;margin-bottom:4px;}
.history-line{
  font-size:12px;color:var(--sub);
  text-align:right;line-height:1.7;
  cursor:pointer;padding:1px 0;
}
.history-line:hover{color:var(--accent);}
.history-sep{margin:4px 0;}
.calc-expr-row{
  font-size:28px;font-weight:400;color:var(--ink);
  text-align:right;min-height:36px;
  word-break:break-all;line-height:1.2;
}
.calc-expr-row .op{color:var(--accent);font-weight:600;}
.calc-result-row{
  font-size:20px;font-weight:400;color:var(--sub);
  text-align:right;word-break:break-all;
  line-height:1.3;margin-top:4px;
}
/* 버튼 그리드 */
.calc-back-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:7px;}
.calc-back-row .btn-back{grid-column:4;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.btn{
  height:64px;border-radius:14px;border:none;
  font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.08s;user-select:none;
}
.btn:active{transform:scale(0.94);}
.btn-num{background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-size:24px;}
.btn-op{background:var(--accent-soft);color:var(--accent);font-size:24px;font-weight:700;}
.btn-eq{background:var(--accent);color:#fff;font-size:26px;}
.btn-clear{background:var(--danger-soft);color:var(--danger);font-size:20px;font-weight:700;}
.btn-back{background:transparent;border:none;color:var(--ink);font-size:26px;}
.calc-keypad-card{padding-top:8px;}

/* ══════════════════════════════
   환율
══════════════════════════════ */
.rate-group{padding:4px 0;}
.rate-row{display:flex;gap:8px;align-items:center;overflow:hidden;}
.rate-select{
  flex:1;min-width:0;height:40px;border-radius:10px;
  border:1.5px solid var(--line);padding:0 8px;
  font-size:15px;font-weight:700;background:var(--bg);color:var(--ink);text-align:center;
  -webkit-appearance:none;appearance:none;
}
.rate-input{
  flex:1.5;min-width:0;width:0;height:40px;border-radius:10px;
  border:2px solid var(--accent);padding:0 10px;
  font-size:18px;font-weight:500;
  background:var(--card);color:var(--ink);text-align:right;
}
.rate-swap{
  -webkit-appearance:none;appearance:none;
  width:36px;height:36px;
  background:transparent;border:none;outline:none;box-shadow:none;
  cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:var(--accent);font-size:20px;
}
.rate-info{font-size:11px;color:var(--sub);text-align:right;margin-top:6px;}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.quick-card{
  background:var(--bg);border-radius:12px;
  padding:10px 12px;cursor:pointer;
}
.quick-card:active{background:var(--accent-soft);}

/* ══════════════════════════════
   단위
══════════════════════════════ */
.unit-tabs{display:flex;gap:4px;background:transparent;border-radius:12px;padding:4px;margin-top:0;}
.unit-tab{
  flex:1;text-align:center;
  padding:8px 4px;border-radius:9px;font-size:12px;font-weight:700;
  border:2px solid var(--line);background:var(--card);
  cursor:pointer;color:var(--sub);
}
.unit-tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.unit-row{display:flex;gap:8px;align-items:center;overflow:hidden;padding:4px 0;}
.unit-select{
  flex:1;min-width:0;height:40px;border-radius:10px;
  border:1.5px solid var(--line);padding:0 8px;
  font-size:15px;font-weight:700;background:var(--bg);color:var(--ink);text-align:center;
  -webkit-appearance:none;appearance:none;
}
.unit-val{
  flex:1.5;min-width:0;width:0;height:40px;border-radius:10px;
  border:2px solid var(--accent);padding:0 10px;
  font-size:18px;font-weight:500;
  background:var(--card);color:var(--ink);text-align:right;
}
.unit-eq-text{font-size:11px;color:var(--sub);text-align:right;margin-top:6px;}

/* ══════════════════════════════
   나이
══════════════════════════════ */
.date-input-row{display:flex;gap:8px;}
.date-input{
  flex:1;min-width:0;height:42px;border-radius:10px;
  border:2px solid var(--accent);padding:0 8px;
  font-size:16px;color:var(--ink);background:var(--card);
  text-align:center;
}
.date-input-year{flex:1.3;}
.date-input::placeholder{font-size:13px;font-weight:300;}
.primary-btn{
  width:100%;height:46px;border-radius:14px;
  background:var(--accent);color:#fff;border:none;
  font-size:16px;font-weight:700;cursor:pointer;margin-top:12px;
}
.primary-btn:active{background:var(--accent-dark);}
.age-results{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#retireResults{margin-top:10px;}
.age-result-card{
  background:var(--bg);border-radius:12px;
  padding:12px;
}
.result-label{font-size:11px;color:var(--sub);margin-bottom:4px;}
.result-val{font-size:26px;font-weight:700;color:var(--accent);}
.result-val.small{font-size:17px;}
.result-sub{font-size:11px;color:var(--sub);margin-top:2px;}
.age-detail{
  background:var(--bg);border-radius:12px;
  padding:12px;margin-top:10px;
}
.detail-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:2px solid var(--line-strong);}
.detail-row:last-child{border-bottom:none;}
.detail-row .k{color:var(--sub);}
.detail-row .v{font-weight:600;color:var(--ink);}
.more-btn{
  display:block;width:100%;text-align:center;
  background:none;border:none;color:var(--accent);
  font-size:12px;font-weight:700;cursor:pointer;
  padding:12px 0 0;
}

/* ══════════════════════════════
   옥외광고
══════════════════════════════ */
.oa-title{
  font-size:13px;font-weight:700;color:var(--ink);
  margin-bottom:10px;
}
.oa-row{
  display:flex;align-items:center;
  padding:8px 0;border-bottom:2px solid var(--line-strong);
}
.oa-row:last-child{border-bottom:none;}
.oa-label{font-size:13px;color:var(--sub);flex:1;}
.oa-unit{font-size:12px;color:var(--sub);width:30px;text-align:right;margin-left:4px;flex-shrink:0;}
.oa-input{
  width:130px;text-align:right;
  background:var(--accent-soft);border:2px solid var(--accent);
  border-radius:10px;padding:5px 8px;
  font-size:15px;color:var(--ink);font-weight:600;
}
.oa-calc{
  width:130px;text-align:right;
  font-size:15px;font-weight:700;
  color:var(--accent);padding:5px 8px;
}

.hidden{display:none;}

/* ── 아이콘 폰트 ── */
@import url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css');
</style>
</head>
<body>
<div id="app">

  <!-- 헤더 -->
  <div class="app-header">
    <div class="header-icon">
      <img src="/icons/icon-192.png" alt="계산 노트">
    </div>
    <span class="header-title">My Calculator</span>
  </div>

  <!-- 탭바 -->
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('calc')">
      <i class="ti ti-calculator"></i>계산기
    </div>
    <div class="tab-item" onclick="switchTab('fx')">
      <i class="ti ti-currency-dollar"></i>환율
    </div>
    <div class="tab-item" onclick="switchTab('unit')">
      <i class="ti ti-ruler"></i>단위
    </div>
    <div class="tab-item" onclick="switchTab('age')">
      <i class="ti ti-cake"></i>나이
    </div>
    <div class="tab-item" onclick="switchTab('oa')">
      <i class="ti ti-ad-2"></i>옥외광고
    </div>
  </div>

  <div class="screens">
  <!-- ═══ 계산기 ═══ -->
  <div id="screen-calc" class="screen active">
   <div class="tab-card corner-first">
    <div class="calc-display">
      <div class="calc-history" id="calcHistory"></div>
      <div class="history-sep" id="historySep" style="display:none"></div>
      <div class="calc-expr-row" id="calcExpr">0</div>
      <div class="calc-result-row" id="calcPreview"></div>
    </div>
   </div>
   <div class="tab-card calc-keypad-card">
    <div class="calc-back-row">
      <button class="btn btn-back"   onclick="ci('⌫')"><i class="ti ti-backspace"></i></button>
    </div>
    <div class="calc-grid">
      <button class="btn btn-clear"  onclick="ci('C')">C</button>
      <button class="btn btn-num"    onclick="ci('()')">( )</button>
      <button class="btn btn-num"    onclick="ci('%')">%</button>
      <button class="btn btn-op"     onclick="ci('÷')">÷</button>
      <button class="btn btn-num"    onclick="ci('7')">7</button>
      <button class="btn btn-num"    onclick="ci('8')">8</button>
      <button class="btn btn-num"    onclick="ci('9')">9</button>
      <button class="btn btn-op"     onclick="ci('×')">×</button>
      <button class="btn btn-num"    onclick="ci('4')">4</button>
      <button class="btn btn-num"    onclick="ci('5')">5</button>
      <button class="btn btn-num"    onclick="ci('6')">6</button>
      <button class="btn btn-op"     onclick="ci('−')">−</button>
      <button class="btn btn-num"    onclick="ci('1')">1</button>
      <button class="btn btn-num"    onclick="ci('2')">2</button>
      <button class="btn btn-num"    onclick="ci('3')">3</button>
      <button class="btn btn-op"     onclick="ci('+')">+</button>
      <button class="btn btn-num"    onclick="ci('0')">0</button>
      <button class="btn btn-num"    onclick="ci('00')">00</button>
      <button class="btn btn-num"    onclick="ci('.')">.</button>
      <button class="btn btn-eq"     onclick="ci('=')">=</button>
    </div>
   </div>
  </div>

  <!-- ═══ 환율 ═══ -->
  <div id="screen-fx" class="screen">
   <div class="tab-card">
      <div class="rate-group">
        <div class="rate-row">
          <select class="rate-select" id="fromCur" onchange="convertFX()">
            <option value="KRW">🇰🇷 KRW 원</option>
            <option value="USD">🇺🇸 USD 달러</option>
            <option value="CNY">🇨🇳 CNY 위안</option>
            <option value="VND">🇻🇳 VND 동</option>
            <option value="JPY">🇯🇵 JPY 엔</option>
            <option value="EUR">🇪🇺 EUR 유로</option>
            <option value="CAD">🇨🇦 CAD 달러</option>
            <option value="AUD">🇦🇺 AUD 달러</option>
            <option value="PEN">🇵🇪 PEN 솔</option>
          </select>
          <input class="rate-input" id="fromVal" type="text" inputmode="decimal" placeholder="0" oninput="formatWithCommas(this,true);convertFX('from')">
        </div>
      </div>
      <div style="text-align:center;">
        <button class="rate-swap" onclick="swapFX()">
          <i class="ti ti-arrows-up-down"></i>
        </button>
      </div>
      <div class="rate-group">
        <div class="rate-row">
          <select class="rate-select" id="toCur" onchange="convertFX()">
            <option value="USD">🇺🇸 USD 달러</option>
            <option value="KRW">🇰🇷 KRW 원</option>
            <option value="CNY">🇨🇳 CNY 위안</option>
            <option value="VND">🇻🇳 VND 동</option>
            <option value="JPY">🇯🇵 JPY 엔</option>
            <option value="EUR">🇪🇺 EUR 유로</option>
            <option value="CAD">🇨🇦 CAD 달러</option>
            <option value="AUD">🇦🇺 AUD 달러</option>
            <option value="PEN">🇵🇪 PEN 솔</option>
          </select>
          <input class="rate-input" id="toVal" type="text" inputmode="decimal" placeholder="0" oninput="formatWithCommas(this,true);convertFX('to')">
        </div>
        <div class="rate-info" id="rateInfo"></div>
      </div>
   </div>
   <div class="tab-card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <span style="font-size:12px;color:var(--sub);font-weight:600;">주요 통화 (KRW 기준)</span>
        <span style="font-size:11px;color:var(--sub);" id="fxStatusText">환율 불러오는 중...</span>
      </div>
      <div class="quick-grid" id="quickGrid"></div>
   </div>
  </div>

  <!-- ═══ 단위 ═══ -->
  <div id="screen-unit" class="screen">
   <div class="tab-card">
      <div class="unit-row">
        <select class="unit-select" id="fromUnit" onchange="convertUnit()"></select>
        <input class="unit-val" id="fromUnitVal" type="text" inputmode="decimal" placeholder="0"
          oninput="convertUnit('from')">
      </div>
      <div style="text-align:center;">
        <button class="rate-swap" onclick="swapUnit()">
          <i class="ti ti-arrows-up-down"></i>
        </button>
      </div>
      <div class="unit-row">
        <select class="unit-select" id="toUnit" onchange="convertUnit()"></select>
        <input class="unit-val" id="toUnitVal" type="text" inputmode="decimal" placeholder="0" oninput="convertUnit('to')">
      </div>
      <div class="unit-eq-text" id="unitEqText"></div>
   </div>
   <div class="tab-card">
      <div class="unit-tabs">
        <div class="unit-tab active" onclick="switchUnit('length',this)">길이</div>
        <div class="unit-tab" onclick="switchUnit('weight',this)">무게</div>
        <div class="unit-tab" onclick="switchUnit('area',this)">넓이</div>
        <div class="unit-tab" onclick="switchUnit('temp',this)">온도</div>
        <div class="unit-tab" onclick="switchUnit('speed',this)">속도</div>
      </div>
   </div>
  </div>

  <!-- ═══ 나이 ═══ -->
  <div id="screen-age" class="screen">
   <div class="tab-card corner-first">
      <div class="date-input-row">
        <input class="date-input date-input-year" type="tel" id="birthYear" placeholder="YYYY" inputmode="numeric" maxlength="4" oninput="ageInputMove(this,'birthMonth',4)">
        <input class="date-input" type="tel" id="birthMonth" placeholder="MM" inputmode="numeric" maxlength="2" oninput="ageInputMove(this,'birthDay',2)">
        <input class="date-input" type="tel" id="birthDay" placeholder="DD" inputmode="numeric" maxlength="2" oninput="ageInputMove(this,null,2)">
      </div>
      <button class="primary-btn" onclick="calcAge()">나이 계산</button>
   </div>
   <div id="ageResults" class="tab-card hidden">
        <div class="age-results">
          <div class="age-result-card">
            <div class="result-label">세는 나이</div>
            <div class="result-val" id="korAge">–</div>
            <div class="result-sub">한국식</div>
          </div>
          <div class="age-result-card">
            <div class="result-label">만 나이</div>
            <div class="result-val" id="intAge">–</div>
            <div class="result-sub">국제 기준</div>
          </div>
        </div>
        <div class="age-detail">
          <div class="detail-row"><span class="k">생년월일</span><span class="v" id="ageBirth">–</span></div>
          <div class="detail-row"><span class="k">띠</span><span class="v" id="ageZodiac">–</span></div>
          <div class="detail-row"><span class="k">오늘</span><span class="v" id="ageToday">–</span></div>
          <div class="detail-row"><span class="k">태어난 지</span><span class="v" id="ageDays">–</span></div>
          <div class="detail-row"><span class="k">다음 생일까지</span><span class="v" id="ageNextBday">–</span></div>
        </div>
        <button class="more-btn" id="moreBtn" onclick="toggleMore()">더 보기 ▾</button>
        <div class="age-results" id="retireResults" style="display:none;">
          <div class="age-result-card">
            <div class="result-label">60세 퇴직일</div>
            <div class="result-val small" id="retire60Date">–</div>
            <div class="result-sub" id="retire60Left">–</div>
          </div>
          <div class="age-result-card">
            <div class="result-label">65세 퇴직일</div>
            <div class="result-val small" id="retire65Date">–</div>
            <div class="result-sub" id="retire65Left">–</div>
          </div>
        </div>
   </div>
  </div>

  <!-- ═══ 옥외광고 ═══ -->
  <div id="screen-oa" class="screen">
   <div class="tab-card">
      <div class="oa-title">1구좌 노출 분석</div>
      <div class="oa-rows">
        <div class="oa-row">
          <span class="oa-label">월 광고료</span>
          <input class="oa-input" id="oa_cost" type="text" inputmode="numeric" placeholder="0" oninput="formatWithCommas(this,false);calcOA()">
          <span class="oa-unit">원</span>
        </div>
        <div class="oa-row">

<script>
'use strict';

/* ══════════════════════════════
   탭 전환
══════════════════════════════ */
const TABS = ['calc','fx','unit','age','oa'];
let currentTab = 'calc';
let tabSwitching = false;
function switchTab(t) {
  if (t === currentTab || tabSwitching) return;
  const idx = TABS.indexOf(t);
  const curIdx = TABS.indexOf(currentTab);
  const forward = idx > curIdx;

  const oldScreen = document.getElementById('screen-' + currentTab);
  const newScreen = document.getElementById('screen-' + t);
  currentTab = t;

  document.querySelectorAll('.tab-item').forEach((el,i) =>
    el.classList.toggle('active', TABS[i] === t));
  const card = newScreen.querySelector('.tab-card');
  if (card) {
    card.classList.toggle('corner-first', idx === 0);
    card.classList.toggle('corner-last', idx === TABS.length - 1);
  }

  tabSwitching = true;
  newScreen.style.transition = 'none';
  newScreen.style.transform = `translateX(${forward ? 100 : -100}%)`;
  newScreen.classList.add('active');
  oldScreen.style.transition = 'none';
  oldScreen.style.transform = 'translateX(0)';

  void newScreen.offsetWidth; // reflow so the transition below is picked up

  requestAnimationFrame(() => {
    oldScreen.style.transition = newScreen.style.transition = 'transform .25s ease';
    oldScreen.style.transform = `translateX(${forward ? -100 : 100}%)`;
    newScreen.style.transform = 'translateX(0)';
  });

  let cleaned = false;
  const cleanup = () => {
    if (cleaned) return;
    cleaned = true;
    oldScreen.classList.remove('active');
    oldScreen.style.transition = oldScreen.style.transform = '';
    newScreen.style.transition = newScreen.style.transform = '';
    tabSwitching = false;
    newScreen.removeEventListener('transitionend', cleanup);
  };
  newScreen.addEventListener('transitionend', cleanup);
  setTimeout(cleanup, 300);
}

/* ══════════════════════════════
   탭 스와이프 (화면 하단 30% 영역에서만 인식)
══════════════════════════════ */
(function initTabSwipe() {
  const SWIPE_MIN_X   = 50;
  const SWIPE_MAX_Y   = 80;
  const SWIPE_MAX_TIME = 600;
  const SWIPE_ZONE_RATIO = 0.3; // 화면 하단 30%
  let startX = 0, startY = 0, startT = 0, tracking = false;

  function isInteractive(el) {
    return !!el.closest(
      'button, input, select, textarea, a, .btn, .tab-item, .unit-tab, ' +
      '.rate-swap, .more-btn, .quick-card, .history-line'
    );
  }

  document.querySelectorAll('.screen').forEach(screen => {
    screen.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { tracking = false; return; }
      const y = e.touches[0].clientY;
      const zoneTop = window.innerHeight * (1 - SWIPE_ZONE_RATIO);
      if (y < zoneTop) { tracking = false; return; }
      tracking = !isInteractive(e.target);
      if (!tracking) return;
      startX = e.touches[0].clientX;
      startY = y;
      startT = Date.now();
    }, { passive: true });

    screen.addEventListener('touchend', e => {
      if (!tracking) return;
      tracking = false;
      const touch = e.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;
      const dt = Date.now() - startT;
      if (dt > SWIPE_MAX_TIME) return;
      if (Math.abs(dx) < SWIPE_MIN_X || Math.abs(dy) > SWIPE_MAX_Y) return;

      const idx = TABS.indexOf(currentTab);
      if (dx < 0 && idx < TABS.length - 1) switchTab(TABS[idx + 1]);
      else if (dx > 0 && idx > 0) switchTab(TABS[idx - 1]);
    }, { passive: true });
  });
})();

/* ══════════════════════════════
   계산기
══════════════════════════════ */
const OPS = ['÷','×','−','+'];
let calcHist = [];
let curExpr   = '';
let curDisp   = '0';
let lastRes   = null;
let evaled    = false;
let parenD    = 0;

function numFmt(n) {
  if (typeof n !== 'number' || isNaN(n)) return String(n);
  const s = parseFloat(n.toPrecision(12)).toString();
  const [int, dec] = s.split('.');
  const fmtInt = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return dec !== undefined ? fmtInt + '.' + dec : fmtInt;
}

function colorExpr(s) {
  return s.replace(/([÷×−+])/g, '<span class="op">$1</span>');
}

function tryEval(expr) {
  try {
    const e = expr.replace(/,/g,'').replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
    const r = Function('"use strict";return(' + e + ')')();
    return (typeof r === 'number' && isFinite(r)) ? r : null;
  } catch { return null; }
}

function ci(k) {
  if (navigator.vibrate) navigator.vibrate(10);
  if (k === 'C') {
    curExpr = ''; curDisp = '0'; lastRes = null; evaled = false; parenD = 0;
  } else if (k === '⌫') {
    if (evaled) {
      curExpr = ''; curDisp = '0'; lastRes = null; evaled = false; parenD = 0;
    } else {
      let full = (curExpr || curDisp).slice(0, -1);
      if (full === '') {
        curExpr = ''; curDisp = '0'; parenD = 0;
      } else {
        curExpr = full;
        const m = full.match(/(\d+\.?\d*|\.\d+)$/);
        curDisp = m ? m[0] : full.slice(-1);
        parenD = (full.match(/\(/g) || []).length - (full.match(/\)/g) || []).length;
      }
    }
  } else if (k === '()') {
    if (evaled) { curExpr = numFmt(lastRes); evaled = false; }
    const last = curExpr.slice(-1);
    if (parenD === 0 || OPS.includes(last) || last === '(') {
      curExpr += '('; parenD++; curDisp = '(';
    } else {
      curExpr += ')'; parenD = Math.max(0, parenD - 1); curDisp = ')';
    }
  } else if (k === '%') {
    const v = parseFloat(curDisp.replace(/,/g,''));
    if (!isNaN(v)) {
      const r = v / 100;
      curDisp = numFmt(r);
      if (evaled) lastRes = r;
      const li = Math.max(...OPS.map(o => curExpr.lastIndexOf(o)));
      curExpr = li >= 0 ? curExpr.slice(0, li+1) + numFmt(r) : numFmt(r);
    }
  } else if (k === '=') {
    const full = curExpr || curDisp;
    const r = tryEval(full);
    if (r !== null) {
      calcHist.push({ expr: curExpr || curDisp, result: numFmt(r) });
      if (calcHist.length > 5) calcHist.shift();
      curExpr = ''; lastRes = r; curDisp = numFmt(r); evaled = true; parenD = 0;
    } else {
      curDisp = '오류';
    }
  } else if (OPS.includes(k)) {
    if (evaled) { curExpr = numFmt(lastRes) + k; curDisp = k; evaled = false; }
    else {
      const last = curExpr.slice(-1);
      if (OPS.includes(last)) curExpr = curExpr.slice(0,-1) + k;
      else curExpr = (curExpr || curDisp) + k;
      curDisp = k;
    }
  } else if (k === '00') {
    if (evaled) { curExpr = ''; curDisp = '0'; lastRes = null; evaled = false; }
    appendDigit('0'); appendDigit('0');
    const li = Math.max(...OPS.map(o => curExpr.lastIndexOf(o)),
                        curExpr.lastIndexOf('('));
    curExpr = li >= 0 ? curExpr.slice(0, li+1) + curDisp : curDisp;
  } else {
    if (evaled) { curExpr = ''; curDisp = '0'; lastRes = null; evaled = false; }
    appendDigit(k);
    const li = Math.max(...OPS.map(o => curExpr.lastIndexOf(o)),
                        curExpr.lastIndexOf('('));
    curExpr = li >= 0 ? curExpr.slice(0, li+1) + curDisp : curDisp;
  }
  renderCalc();
}

function appendDigit(k) {
  if (k === '.' && curDisp.includes('.')) { /* skip */ }
  else if (k === '.' && (curDisp === '' || OPS.includes(curDisp) || curDisp === '(')) {
    curDisp = '0.';
  } else if ((curDisp === '0' || OPS.includes(curDisp) || curDisp === '(') && k !== '.') {
    curDisp = k;
  } else {
    curDisp += k;
  }
}

function renderCalc() {
  // 히스토리
  const hEl = document.getElementById('calcHistory');
  const sep  = document.getElementById('historySep');
  if (calcHist.length > 0) {
    hEl.innerHTML = calcHist.map((h,i) =>
      `<div class="history-line" onclick="useHist(${i})">${h.expr} = ${h.result}</div>`
    ).join('');
    sep.style.display = 'block';
  } else { hEl.innerHTML = ''; sep.style.display = 'none'; }

  // 수식 표시
  document.getElementById('calcExpr').innerHTML =
    colorExpr(evaled ? curDisp : (curExpr || '0'));

  // 실시간 미리보기
  let preview = '';
  if (!evaled && curExpr && !OPS.includes(curExpr.slice(-1)) && curExpr !== curDisp) {
    const r = tryEval(curExpr);
    if (r !== null) preview = '= ' + numFmt(r);
  }
  document.getElementById('calcPreview').textContent = preview;
}

function useHist(i) {
  const h = calcHist[i];
  lastRes = parseFloat(h.result.replace(/,/g,''));
  curDisp = h.result; curExpr = ''; evaled = true;
  renderCalc();
}

renderCalc();

/* ══════════════════════════════
   숫자 입력 천단위 콤마
══════════════════════════════ */
function formatWithCommas(el, allowDecimal) {
  let v = el.value.replace(/,/g, '');
  if (allowDecimal) {
    v = v.replace(/[^\d.]/g, '');
    const firstDot = v.indexOf('.');
    if (firstDot !== -1) {
      v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '');
    }
    const [intPart, decPart] = v.split('.');
    const fmtInt = (intPart || '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    el.value = decPart !== undefined ? fmtInt + '.' + decPart : fmtInt;
  } else {
    v = v.replace(/\D/g, '');
    el.value = v.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
}
function numVal(el) {
  return parseFloat(el.value.replace(/,/g, '')) || 0;
}

/* ══════════════════════════════
   환율
══════════════════════════════ */
let fxRates = {};
let fxLast = 'from';
const CUR_SYMBOL = {USD:'$', JPY:'¥', CNY:'¥', VND:'₫', EUR:'€', CAD:'C$', AUD:'A$', KRW:'₩', PEN:'S/'};

async function loadFX() {
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/KRW');
    const d   = await res.json();
    fxRates = d.rates;
    const dt = new Date(d.time_last_update_utc);
    document.getElementById('fxStatusText').textContent =
      `${dt.getMonth()+1}월 ${dt.getDate()}일 ${dt.getHours()}시 기준`;
    convertFX();
    renderQuick();
  } catch(e) {
    document.getElementById('fxStatusText').textContent = '환율 로드 실패 (오프라인 모드)';
  }
}

function fmtFX(result) {
  return result !== 0 && Math.abs(result) < 0.01
    ? result.toFixed(6)
    : numFmt(parseFloat(result.toFixed(2)));
}

function convertFX(dir) {
  if (dir) fxLast = dir;
  if (!Object.keys(fxRates).length) return;
  const from = document.getElementById('fromCur').value;
  const to   = document.getElementById('toCur').value;
  if (fxLast === 'to') {
    const val  = numVal(document.getElementById('toVal'));
    const rate = (1 / fxRates[to]) * fxRates[from];
    document.getElementById('fromVal').value = fmtFX(val * rate);
  } else {
    const val  = numVal(document.getElementById('fromVal'));
    const rate = (1 / fxRates[from]) * fxRates[to];
    document.getElementById('toVal').value = fmtFX(val * rate);
  }
  const base = from === 'KRW' ? 1000 : 1;
  const baseRate = ((1 / fxRates[from]) * fxRates[to]) * base;
  const r1 = baseRate < 0.01 ? baseRate.toFixed(6) : baseRate.toFixed(4);
  document.getElementById('rateInfo').textContent = `${numFmt(base)} ${from} = ${r1} ${to}`;
}

function swapFX() {
  const f = document.getElementById('fromCur');
  const t = document.getElementById('toCur');
  const fv = document.getElementById('fromVal');
  const tv = document.getElementById('toVal');
  [f.value, t.value] = [t.value, f.value];
  [fv.value, tv.value] = [tv.value, fv.value];
  fxLast = fxLast === 'from' ? 'to' : 'from';
  convertFX();
}

function renderQuick() {
  const pairs = [['USD','🇺🇸'],['JPY','🇯🇵'],['CNY','🇨🇳'],['VND','🇻🇳'],
                 ['EUR','🇪🇺'],['CAD','🇨🇦'],['AUD','🇦🇺'],['PEN','🇵🇪']];
  document.getElementById('quickGrid').innerHTML = pairs.map(([c,f]) => `
    <div class="quick-card" onclick="setQuick('${c}')">
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:20px;">${f}</span>
        <span style="font-size:13px;font-weight:600;color:var(--ink);">${c}</span>
      </div>
      <div style="font-size:12px;color:var(--sub);margin-top:4px;text-align:right;">
        ₩1,000 = ${CUR_SYMBOL[c]}${c==='JPY'
          ? (1000*fxRates[c]).toFixed(1)
          : c==='VND'
          ? numFmt(Math.round(1000*fxRates[c]))
          : (1000*fxRates[c]).toFixed(2)}
      </div>
    </div>`).join('');
}

function setQuick(c) {
  document.getElementById('fromCur').value = 'KRW';
  document.getElementById('toCur').value   = c;
  document.getElementById('fromVal').value = '10,000';
  convertFX('from');
}

loadFX();

/* ══════════════════════════════
   단위 변환
══════════════════════════════ */
const UNITS = {
  length: { units: [
    {k:'m',  label:'미터 (m)',       base:1},
    {k:'km', label:'킬로미터 (km)', base:1000},
    {k:'cm', label:'센티미터 (cm)', base:0.01},
    {k:'mm', label:'밀리미터 (mm)', base:0.001},
    {k:'mi', label:'마일 (mi)',      base:1609.344},
    {k:'yd', label:'야드 (yd)',      base:0.9144},
    {k:'ft', label:'피트 (ft)',      base:0.3048},
    {k:'in', label:'인치 (in)',      base:0.0254},
    {k:'nm', label:'해리 (nm)',      base:1852},
  ]},
  weight: { units: [
    {k:'kg',  label:'킬로그램 (kg)', base:1},
    {k:'g',   label:'그램 (g)',      base:0.001},
    {k:'lb',  label:'파운드 (lb)',   base:0.453592},
    {k:'oz',  label:'온스 (oz)',     base:0.0283495},
    {k:'t',   label:'톤 (t)',        base:1000},
    {k:'jin', label:'근 (斤)',       base:0.6},
  ]},
  area: { units: [
    {k:'m2',   label:'제곱미터 (m²)',   base:1},
    {k:'km2',  label:'제곱킬로미터',    base:1e6},
    {k:'cm2',  label:'제곱센티미터',    base:0.0001},
    {k:'ha',   label:'헥타르 (ha)',     base:10000},
    {k:'py',   label:'평 (坪)',         base:3.30579},
    {k:'acre', label:'에이커 (acre)',   base:4046.86},
    {k:'ft2',  label:'제곱피트 (ft²)', base:0.0929},
  ]},
  temp: { units: [
    {k:'C', label:'섭씨 (°C)', base:null},
    {k:'F', label:'화씨 (°F)', base:null},
    {k:'K', label:'켈빈 (K)',  base:null},
  ]},
  speed: { units: [
    {k:'mps', label:'m/s',       base:1},
    {k:'kph', label:'km/h',      base:1/3.6},
    {k:'mph', label:'mph',       base:0.44704},
    {k:'kt',  label:'노트 (kt)', base:0.514444},
  ]}
};

let curUnitType = 'length';
let unitLast = 'from';
const TEMP_TIP = '°F = °C×9/5+32  ·  K = °C+273.15';

function switchUnit(type, el) {
  curUnitType = type;
  document.querySelectorAll('.unit-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadUnitSelects();
}

function loadUnitSelects() {
  const def  = UNITS[curUnitType];
  const opts = def.units.map(u => `<option value="${u.k}">${u.label}</option>`).join('');
  document.getElementById('fromUnit').innerHTML = opts;
  document.getElementById('toUnit').innerHTML   = opts;
  document.getElementById('toUnit').selectedIndex = 1;
  document.getElementById('fromUnitVal').value = '';
  document.getElementById('toUnitVal').value = '';
  unitLast = 'from';
  convertUnit();
}

function fmtUnit(result) {
  return Math.abs(result) >= 0.0001 || result === 0
    ? parseFloat(result.toPrecision(8)).toString()
    : result.toExponential(4);
}

function tempConvert(val, from, to) {
  const c = from==='C' ? val : from==='F' ? (val-32)*5/9 : val-273.15;
  return to==='C' ? c : to==='F' ? c*9/5+32 : c+273.15;
}

function convertUnit(dir) {
  if (dir) unitLast = dir;
  const from = document.getElementById('fromUnit').value;
  const to   = document.getElementById('toUnit').value;
  const def  = UNITS[curUnitType];
  if (unitLast === 'to') {
    const val = parseFloat(document.getElementById('toUnitVal').value) || 0;
    let result;
    if (curUnitType === 'temp') {
      result = tempConvert(val, to, from);
    } else {
      const fu = def.units.find(u => u.k === from);
      const tu = def.units.find(u => u.k === to);
      result = val * tu.base / fu.base;
    }
    document.getElementById('fromUnitVal').value = fmtUnit(result);
  } else {
    const val = parseFloat(document.getElementById('fromUnitVal').value) || 0;
    let result;
    if (curUnitType === 'temp') {
      result = tempConvert(val, from, to);
    } else {
      const fu = def.units.find(u => u.k === from);
      const tu = def.units.find(u => u.k === to);
      result = val * fu.base / tu.base;
    }
    document.getElementById('toUnitVal').value = fmtUnit(result);
  }
  if (curUnitType !== 'temp') {
    const fu = def.units.find(u => u.k === from);
    const tu = def.units.find(u => u.k === to);
    const r  = parseFloat((fu.base / tu.base).toPrecision(6));
    document.getElementById('unitEqText').textContent = `1 ${from} = ${r} ${to}`;
  } else {
    document.getElementById('unitEqText').textContent = TEMP_TIP;
  }
}

function swapUnit() {
  const f = document.getElementById('fromUnit');
  const t = document.getElementById('toUnit');
  const fv = document.getElementById('fromUnitVal');
  const tv = document.getElementById('toUnitVal');
  [f.value, t.value] = [t.value, f.value];
  [fv.value, tv.value] = [tv.value, fv.value];
  unitLast = unitLast === 'from' ? 'to' : 'from';
  convertUnit();
}

loadUnitSelects();

/* ══════════════════════════════
   나이 계산
══════════════════════════════ */
const ZODIAC = ['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
function getZodiac(year) {
  return ZODIAC[((year - 4) % 12 + 12) % 12];
}

function ageInputMove(el, nextId, maxLen) {
  el.value = el.value.replace(/\D/g, '').slice(0, maxLen);
  const v = el.value;
  const isMonthField = nextId === 'birthDay';
  const earlyMove = isMonthField && v.length === 1 && parseInt(v, 10) >= 2;
  if ((v.length === maxLen || earlyMove) && nextId) {
    document.getElementById(nextId).focus();
  }
  calcAge();
}

function calcAge() {
  const y = parseInt(document.getElementById('birthYear').value, 10);
  const m = parseInt(document.getElementById('birthMonth').value, 10);
  const d = parseInt(document.getElementById('birthDay').value, 10);
  if (!y || !m || !d || y < 1000 || m < 1 || m > 12 || d < 1 || d > 31) return;
  const b = new Date(y, m - 1, d);
  if (b.getFullYear() !== y || b.getMonth() !== m - 1 || b.getDate() !== d) return;
  const t = new Date();
  const by = b.getFullYear(), bm = b.getMonth(), bd = b.getDate();
  const ty = t.getFullYear(), tm = t.getMonth(), td = t.getDate();
  const intAge = ty - by - (tm < bm || (tm === bm && td < bd) ? 1 : 0);
  const korAge = ty - by + 1;
  const diffDays = Math.floor((t - b) / 86400000);
  const nextBday = new Date(ty, bm, bd);
  if (nextBday <= t) nextBday.setFullYear(ty + 1);
  const daysLeft = Math.ceil((nextBday - t) / 86400000);
  document.getElementById('korAge').textContent    = korAge + '세';
  document.getElementById('intAge').textContent    = intAge + '세';
  document.getElementById('ageBirth').textContent  = `${by}.${String(bm+1).padStart(2,'0')}.${String(bd).padStart(2,'0')}`;
  document.getElementById('ageZodiac').textContent = getZodiac(by) + '띠';
  document.getElementById('ageToday').textContent  = `${ty}.${String(tm+1).padStart(2,'0')}.${String(td).padStart(2,'0')}`;
  document.getElementById('ageDays').textContent   = diffDays.toLocaleString() + '일';
  document.getElementById('ageNextBday').textContent = daysLeft + '일';

  [[60,'retire60Date','retire60Left'],[65,'retire65Date','retire65Left']].forEach(([age,dId,lId]) => {
    const rd = new Date(by + age, bm, bd);
    const rDaysLeft = Math.ceil((rd - t) / 86400000);
    const years = Math.abs(rDaysLeft / 365.25).toFixed(1);
    document.getElementById(dId).textContent = `${rd.getFullYear()}.${String(rd.getMonth()+1).padStart(2,'0')}.${String(rd.getDate()).padStart(2,'0')}`;
    document.getElementById(lId).textContent = rDaysLeft >= 0 ? `${years}년 남음` : `${years}년 지남`;
  });

  document.getElementById('ageResults').classList.remove('hidden');
}

let moreShown = false;
function toggleMore() {
  moreShown = !moreShown;
  document.getElementById('retireResults').style.display = moreShown ? 'grid' : 'none';
  document.getElementById('moreBtn').textContent = moreShown ? '접기 ▴' : '더 보기 ▾';
}

/* ══════════════════════════════
   옥외광고
══════════════════════════════ */
function calcOA() {
  const cost  = numVal(document.getElementById('oa_cost'));
  const daily = numVal(document.getElementById('oa_daily'));
  const slots = numVal(document.getElementById('oa_slots'));
  const cpe         = daily > 0 ? cost / (daily * 30) : 0;
  const monthlyRev  = cost * slots;
  const yearlyRev   = monthlyRev * 12;
  document.getElementById('oa_cpe').textContent     = daily > 0 ? Math.round(cpe).toLocaleString('ko-KR') : '–';
  document.getElementById('oa_monthly').textContent = slots > 0 && cost > 0 ? monthlyRev.toLocaleString('ko-KR') : '–';
  document.getElementById('oa_yearly').textContent  = slots > 0 && cost > 0 ? yearlyRev.toLocaleString('ko-KR')  : '–';
}
